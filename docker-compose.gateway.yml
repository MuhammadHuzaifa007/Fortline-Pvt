version: '3.8'

# ============================================================
# Fortline-Pvt: WhatsApp Multi-Device Gateway (Path B)
# Runs Evolution API v2 to connect 30 sales lines via QR Code
# ============================================================
# Quick Start:
#   docker compose -f docker-compose.gateway.yml up -d
#
# Access API Docs / Health:
#   http://localhost:8080
# ============================================================

services:
  # ------------------------------------------------------------
  # PostgreSQL Database for Evolution API v2 Migrations
  # ------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: fortline_database
    environment:
      - POSTGRES_USER=fortline
      - POSTGRES_PASSWORD=fortline_secret
      - POSTGRES_DB=evolution
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # ------------------------------------------------------------
  # Redis Cache for Websockets & Queue Management
  # ------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: fortline_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ------------------------------------------------------------
  # Evolution API Gateway
  # ------------------------------------------------------------
  fortline-evolution-gateway:
    image: evoapicloud/evolution-api:latest
    container_name: fortline_evolution_gateway
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      # Server config
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080

      # API Authentication Key (Matches CRM config)
      - AUTHENTICATION_API_KEY=fortline-secret-api-key
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # Database Connection 
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://fortline:fortline_secret@postgres:5432/evolution?schema=public

      # Redis Cache Configuration
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evo
      - CACHE_LOCAL_ENABLED=false

      # Global Webhook to push events into Fortline CRM
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:3000/api/gateway/webhook
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true

      # Enabled events
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=true

      # Logging
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG
      - LOG_COLOR=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_instances:
    name: fortline_evolution_instances
  evolution_store:
    name: fortline_evolution_store
  postgres_data:
    name: fortline_postgres_data
  redis_data:
    name: fortline_redis_data
