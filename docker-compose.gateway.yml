version: '3.8'

# ============================================================
# Fortline-Pvt: WhatsApp Multi-Device Gateway (Path B)
# Runs Evolution API v2 to connect 30 sales lines via QR Code
# ============================================================
# Quick Start:
#   docker compose -f docker-compose.gateway.yml up -d
#
# Access API Docs / Health:
#   http://localhost:8080
# ============================================================

services:
  fortline-evolution-gateway:
    image: atendai/evolution-api:v2.1.2
    container_name: fortline_evolution_gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Server config
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080

      # API Authentication Key (Matches CRM config)
      - AUTHENTICATION_API_KEY=fortline-secret-api-key
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # WhatsApp session client branding
      - CONFIG_SESSION_PHONE_CLIENT=Fortline CRM
      - CONFIG_SESSION_PHONE_NAME=Chrome

      # Local persistent storage for WhatsApp session keys
      - DATABASE_ENABLED=false

      # Global Webhook to push events into Fortline CRM
      # In local development: http://host.docker.internal:3000/api/gateway/webhook
      # In production: https://[your-crm-domain]/api/gateway/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:3000/api/gateway/webhook
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true

      # Enabled events
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=true

      # Logging
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG
      - LOG_COLOR=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_instances:
    name: fortline_evolution_instances
  evolution_store:
    name: fortline_evolution_store
